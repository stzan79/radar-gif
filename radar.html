<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Radar Animation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #radarContainer {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="radarContainer">
    <video 
      id="radarVideo"
      autoplay 
      muted 
      loop 
      playsinline>
    </video>
  </div>

  <script>
    const radarVideo = document.getElementById("radarVideo");

    fetch("radar.json?t=" + Date.now())
      .then(response => response.json())
      .then(data => {
        radarVideo.src = data.url;
      })
      .catch(error => {
        console.error("Error loading radar.json:", error);
      });
  </script>

</body>
</html>
