<!DOCTYPE html>
<html lang="el">
<head>

  <title>Radar Animation</title>

      width: 100%;
      height: 100%;
      background: #ffffff; /* Λευκό background για όλη τη σελίδα */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Αποφεύγει τυχόν scrollbars */
    }

    #radarContainer {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;

      align-items: center;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      background: #ffffff;
    }
